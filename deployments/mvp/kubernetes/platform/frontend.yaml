apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aiinfra
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aiinfra-frontend
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: aiinfra
  labels:
    app.kubernetes.io/name: aiinfra-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiinfra-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiinfra-frontend
    spec:
      containers:
        - name: frontend
          image: aiinfra-frontend:mvp
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
