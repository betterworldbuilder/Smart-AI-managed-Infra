apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiinfra-backend
  namespace: aiinfra
---
# The Governor needs to *read* the whole cluster (inventory) and to *create*
# the resources an approved DeploymentSpec describes -- and nothing else. In
# particular it can read no Secrets: the LLM boundary is enforced in code, and
# this RBAC makes it enforceable by the cluster too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aiinfra-backend
rules:
  - apiGroups: ['']
    resources: ['nodes', 'nodes/status', 'namespaces', 'pods', 'services',
                'persistentvolumeclaims', 'persistentvolumes', 'events',
                'configmaps', 'serviceaccounts']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['deployments', 'statefulsets', 'daemonsets', 'replicasets']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['batch']
    resources: ['jobs', 'cronjobs']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['networking.k8s.io']
    resources: ['networkpolicies', 'ingresses']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['storage.k8s.io']
    resources: ['storageclasses']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['metrics.k8s.io']
    resources: ['nodes', 'pods']
    verbs: ['get', 'list']
  - apiGroups: ['kustomize.toolkit.fluxcd.io', 'source.toolkit.fluxcd.io',
                'helm.toolkit.fluxcd.io']
    resources: ['*']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch']
  - apiGroups: ['monitoring.coreos.com']
    resources: ['servicemonitors', 'podmonitors']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
  - apiGroups: ['postgresql.cnpg.io']
    resources: ['clusters', 'scheduledbackups']
    verbs: ['get', 'list', 'watch', 'create', 'update', 'patch', 'delete']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aiinfra-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aiinfra-backend
subjects:
  - kind: ServiceAccount
    name: aiinfra-backend
    namespace: aiinfra
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aiinfra
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: aiinfra-backend
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      nodePort: 30001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: aiinfra
  labels:
    app.kubernetes.io/name: aiinfra-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: aiinfra-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiinfra-backend
    spec:
      serviceAccountName: aiinfra-backend
      containers:
        - name: backend
          image: aiinfra-backend:mvp
          imagePullPolicy: IfNotPresent
          env:
            - name: INFRA_MODE
              value: mvp
            - name: SIMULATION_MODE
              value: 'false'
            # Kubernetes is real; the rest of the datacenter is still modelled.
            - name: OPENSTACK_MODE
              value: mock
            - name: CEPH_MODE
              value: mock
            - name: GENESTACK_MODE
              value: mock
            - name: OPEN_CENTER_MODE
              value: compat
            - name: LLM_PROVIDER
              value: mock
            - name: POLICY_ENGINE
              value: opa
            - name: OPA_URL
              value: http://opa:8181
            - name: DATABASE_URL
              value: postgresql+asyncpg://gpuinfra:gpuinfra@postgres:5432/gpuinfra
            - name: REDIS_URL
              value: redis://redis:6379
            - name: AUTH_ENABLED
              value: 'false'
            - name: AUTH_USERNAME
              value: admin
            - name: AUTH_PASSWORD
              value: admin
            - name: GITOPS_WORKING_TREE
              value: /var/lib/aiinfra/gitops
            - name: KIND_CLUSTER_NAME
              value: gpu-native-mvp
            - name: KUBERNETES_CONTEXT
              value: ''
            - name: DEPLOY_STEP_SECONDS
              value: '0.5'
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
          volumeMounts:
            - name: gitops
              mountPath: /var/lib/aiinfra/gitops
      volumes:
        - name: gitops
          emptyDir: {}
