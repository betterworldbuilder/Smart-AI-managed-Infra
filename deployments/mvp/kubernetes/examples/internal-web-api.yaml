# A hand-written example of what the Governor generates for
# "Deploy an internal web API" in MVP mode. Apply it directly if you want to
# see a real workload without going through the approval flow:
#
#   kubectl apply -f deployments/mvp/kubernetes/examples/internal-web-api.yaml
#
# The real flow (Copilot -> Governor -> approval -> Flux/apply) produces the
# same shape, generated from the DeploymentSpec.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-example-api
  labels:
    aiinfra.io/workload: web-api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-api
  namespace: ai-example-api
  labels:
    app.kubernetes.io/name: example-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: example-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: example-api
    spec:
      containers:
        - name: api
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: example-api
  namespace: ai-example-api
spec:
  selector:
    app.kubernetes.io/name: example-api
  ports:
    - name: http
      port: 80
      targetPort: http
